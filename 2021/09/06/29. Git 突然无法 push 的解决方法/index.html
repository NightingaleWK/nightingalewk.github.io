<main id="main" class="post-layout"><article><div class="post-header"><div class="eyebrow"><a href="/archives/">← 归档</a></div><h1>Git 突然无法 push 的解决方法</h1><div class="meta"><time datetime="2021-09-06T04:00:00.000Z">2021-09-06</time> · NightingaleWK · 更新于 2023-11-07<br><a href="/categories/git/">git</a></div></div>

<div class="prose"><p>当你明明用得好好的 git 突然无法推送，提示如下信息：</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line">vagrant@homestead:~/code/jianbing$ git push</span><br><span class="line">identity_sign: private key /home/vagrant/.ssh/id_rsa contents do not match public</span><br><span class="line">git@e.coding.net: Permission denied (publickey).</span><br><span class="line">fatal: Could not read from remote repository.</span><br><span class="line"></span><br><span class="line">Please make sure you have the correct access rights</span><br><span class="line">and the repository exists.</span><br></pre></td></tr></table></figure>

<p>只需要重新进行一些配置即可恢复 push，代码如下</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line">git config --global user.name &quot;Your Name&quot;</span><br><span class="line">git config --global user.email your@example.com</span><br><span class="line">eval &quot;$(ssh-agent -s)&quot;</span><br><span class="line">ssh-add ~/.ssh/id_rsa</span><br></pre></td></tr></table></figure>

<p>然后就可以和往常一样的 git push 了</p>
