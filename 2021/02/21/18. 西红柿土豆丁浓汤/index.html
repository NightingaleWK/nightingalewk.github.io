<h2 id="操作"><a href="#操作" class="headerlink" title="操作"></a>操作</h2><ul>
<li>西红柿和土豆切丁</li>
<li>起锅烧油，放入西红柿，翻炒至软烂</li>
<li>倒入土豆继续翻炒数下</li>
<li>加水没过食材，加入生抽和盐</li>
<li>大火煮沸，转中小火炖 5 分钟</li>
<li>出锅前撒入些许鸡精，完成</li>
</ul>
